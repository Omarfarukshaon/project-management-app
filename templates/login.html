<!DOCTYPE html>
<html>
<head>
    <title>Login - Team Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <!-- Changed from "Project Manager" to "Team Workspace" -->
        <h2><i class="fas fa-project-diagram" style="color: #4a90e2; font-size: 32px; margin-bottom: 10px;"></i><br>Project Management system</h2>
        <p style="color: #64748b; margin-bottom: 25px;">Please log in to your account</p>
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" style="width: 100%; margin-top: 10px;">
                <i class="fas fa-sign-in-alt"></i> Log In
            </button>
        </form>
    </div>
</body>
</html>
