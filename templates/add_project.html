<!DOCTYPE html>
<html>
<head>
    <title>Create Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="nav-bar">
            <span><i class="fas fa-folder-plus"></i> Create New Project</span>
            <a href="/" style="color: #4a90e2; font-weight: 600; text-decoration: none;">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>

        <form method="POST">
            <label style="font-weight: 600; color: #475569;">Project Title:</label>
            <input type="text" name="project_title" required placeholder="E.g., Website Redesign">

            <label style="font-weight: 600; color: #475569;">Assign a Manager:</label>
            <select name="manager_id" required style="width: 100%; padding: 15px; margin: 8px 0 24px 0; border: 1px solid #e1e5eb; border-radius: 8px; font-size: 18px;">
                {% for manager in managers %}
                    <option value="{{ manager.id }}">{{ manager.full_name or manager.username }}</option>
                {% endfor %}
            </select>

            <label style="font-weight: 600; color: #475569;">Project Deadline:</label>
            <input type="date" name="project_deadline" required>

            <button type="submit" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-check-circle"></i> Create Project
            </button>
        </form>
    </div>
</body>
</html>
