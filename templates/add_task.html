<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .form-label {
            display: block;
            font-weight: 600;
            color: #475569;
            font-size: 16px;
            margin: 20px 0 9px;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            outline: none;
        }

        .form-control:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74,144,226,0.12);
        }

        .form-description {
            color: #64748b;
            font-size: 13px;
            margin: 5px 0 12px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .form-actions button {
            flex: 1;
        }

        @media(max-width:600px) {
            .container {
                padding: 22px !important;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container" style="max-width:700px;">

    <!-- NAVIGATION -->

    <div class="nav-bar">

        <span>
            <i class="fas fa-tasks" style="color:#4a90e2;"></i>
            Add Task to {{ project.title }}
        </span>

        <a href="{{ url_for('project_detail', project_id=project.id) }}"
           style="color:#4a90e2;font-weight:600;text-decoration:none;">

            <i class="fas fa-times"></i>
            Cancel

        </a>

    </div>


    <form method="POST">

        <!-- TASK TITLE -->

        <label class="form-label" for="task_title">
            Task Title
        </label>

        <p class="form-description">
            Select a task from the available task list.
        </p>

        <select class="form-control"
                name="task_title"
                id="task_title"
                required>

            <option value="" disabled selected>
                -- Select a Task --
            </option>

            {% for title in task_options.keys() %}

            <option value="{{ title }}">
                {{ title }}
            </option>

            {% endfor %}

        </select>


        <!-- PRIORITY -->

        <label class="form-label" for="priority">
            Task Priority
        </label>

        <select class="form-control"
                name="priority"
                id="priority"
                required>

            <option value="Low">
                🟢 Low Priority
            </option>

            <option value="Medium" selected>
                🟡 Medium Priority
            </option>

            <option value="High">
                🟠 High Priority
            </option>

            <option value="Urgent">
                🔴 Urgent / Critical
            </option>

        </select>


        <!-- DEADLINE -->

        <label class="form-label" for="task_deadline">
            Task Deadline
        </label>

        <input class="form-control"
               type="date"
               name="task_deadline"
               id="task_deadline"
               required>


        <!-- BUTTONS -->

        <div class="form-actions">

            <button type="submit">

                <i class="fas fa-plus-circle"></i>
                Create Task

            </button>

            <a href="{{ url_for('project_detail', project_id=project.id) }}"
               class="btn"
               style="text-align:center;text-decoration:none;">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>
</html>
