<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <!-- Clean Top Navigation -->
    <div class="nav-bar" style="width: 95%; max-width: 1400px; margin: 20px auto;">
        <span><i class="fas fa-user-circle"></i> My Profile</span>
        <a href="{{ url_for('dashboard') }}" class="logout-link" style="color: #4a90e2;">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <!-- Centered Profile Settings Card -->
    <div class="container" style="max-width: 650px; margin-top: 50px;">
        <h2 style="text-align: center;"><i class="fas fa-user-cog"></i> Profile Settings</h2>
        
        <!-- Profile Image Preview Fix (Constrains image to a circle) -->
        {% if user.profile_image %}
            <img src="{{ url_for('static', filename='uploads/' + user.profile_image) }}" class="profile-img-preview" alt="Profile Picture">
        {% else %}
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="fas fa-user-circle" style="font-size: 120px; color: #cbd5e1;"></i>
            </div>
        {% endif %}

        <!-- multipart/form-data is required for image uploads! -->
        <form method="POST" enctype="multipart/form-data">
            
            <label style="font-weight: 600; color: #475569;">Profile Picture</label>
            <input type="file" name="profile_image" accept="image/*" style="padding: 10px;">
            
            <label style="font-weight: 600; color: #475569;">Full Name</label>
            <input type="text" name="full_name" value="{{ user.full_name or user.username }}" placeholder="Enter full name" required>
            
            <label style="font-weight: 600; color: #475569;">New Password (leave blank to keep current)</label>
            <input type="password" name="new_password" placeholder="Enter new password">
            
            <button type="submit" name="update_profile" style="width: 100%; margin-top: 15px;">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>

</body>
</html>
